<!doctype html>
<html lang="en-US">
    <!--where meta data is stored & external references are set-->
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <title>Task Manager</title>
        <link href="temp.css" rel="stylesheet"/>
    </head>

<body>

  <div class="app">
    <!-- TITLE HEADER -->
    <header id="titleHeader" class="header">
        <h1>TODO Manager</h1> 
        <div id="date">
            <span>Monday</span>
            <span>3/30/2026</span>
        </div>
    </header>

    <!-- BELOW HEADER -->
    <div class="body">

      <!-- Sidebar -->
      <aside class="sidebar">
        
        <ul>
          <li>Dashboard</li>
          <li>Vital Task</li>
          <li>My Task</li>
          <li>Task Categories</li>
          <li>Settings</li>
          <li>Help</li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <div class="cards">
            <div class="card">To-Do</div>
            <div class="card">Task Status</div>
            <div class="card">Completed</div>
        </div>
      </main>

    </div>

  </div>

</body>
</html>
